name: Bluesky auto post

on:
  schedule:
    # 時刻は UTC 表記です（日本時間 = UTC + 9時間）
    # 下の設定は 毎日 日本時間 9:07 と 21:07 に投稿
    - cron: "7 0,12 * * *"
  workflow_dispatch:   # Actions 画面から手動実行もできる

permissions:
  contents: write      # state.json（次に投稿する番号）を保存するため

concurrency:
  group: bluesky-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post to Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          POST_MODE: sequential   # ランダムにしたい場合は random
          LOOP: "true"            # 最後まで投稿したら最初に戻る
        run: python bot.py

      - name: Save progress
        if: always()
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update post state [skip ci]"
            git push
          fi
