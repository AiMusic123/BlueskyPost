name: Bluesky auto post

on:
  schedule:
    # 時刻は UTC 表記です（日本時間 = UTC + 9時間）
    # 下の設定は 10分置き に投稿
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluesky-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post to Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          POSTS_DIR: Post
          POST_MODE: sequential
          LOOP: "true"
        run: python bot.py

      - name: Save progress
        if: always()
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update post state [skip ci]"
            git push
          fi
